# End-to-end RSI on DeltaServe (ACE Formula): ONE server serves the user traffic, its traces become SFT rows
# (POST /ft/ingest), and the LoRA trains in the inference gaps; see eval-rsi/run_rsi_e2e.sh.
# Same model/recipe as serving_config_finetuning_qwen3_32b_tp4_rsi_ace.yaml, except:
#   - data_path null: the server starts with NO corpus; data arrives from its own traces at runtime.
#   - profile_on_launch true: SLO-aware FT admission from the start (this is a co-serving run).
#   - max_model_len 40960: the ACE prompts with the learned playbook are ~30.5K tokens (shared prefix,
#     prefix-cached).
#   - fwd_token_throttle_enable / pause_prefill_always off: the standard DeltaServe policy (backward yields to
#     prefills, time-slices with decode), not the strict baselines throttle.
finetune:
  enable_finetuning: true
  start_on_launch: false
  backward_mps_percentage: 0
  graph_ft_batches: true
  graph_ft_max_tokens: 512
  backward_run_ahead_boundaries: 2
  finetuning_lora_path: ../adapters/qwen3-32b-qkvo-r16-initial
  data_path: null
  max_saved_finetuning_tokens: 16384
  backward_batch_tokens: 16384
  chat_loss_on: ace                 # RSI-system ACE trainer rendering (thinking off, loss on assistant tokens)
  chat_thinking: "off"
  adapter_save_dir: /mnt/weka/home/jianshu.she/deltaserve/DeltaServe-vLLM/eval-rsi/e2e/adapters
  adapter_save_every: 10
  backward_cuda_graph_max_tokens: 512
  num_epochs: 2
  learning_rate: 0.0001
  weight_decay: 0.0
  gamma: 1.0
  backward_fp32: false
  forward_interruptible: true
  ft_only_admission_grace_ms: 2.0
  rps_throttle_enable: true
  rps_throttle_close_rps: 5.0
  rps_throttle_open_rps: 2.0
  rps_throttle_window_s: 0.1
  rps_throttle_close_time: 1.0
  fwd_token_throttle_enable: false   # standard co-serving: pause the backward on prefills only (the strict 0-token throttle would starve FT under continuous decode)
  fwd_token_throttle: 0
  pause_prefill_always: false
  backward_cuda_graph: true
  backward_cuda_graph_attn_bn_max: 28
  backward_cuda_graph_attn_l_max: 64
  save_attn_qkv: true
  save_attn_ctx: true
  save_resid_mid: true
slo:
  ttft_slo: 0.3
  avg_tbt_slo: 0.02
  max_tbt_slo: 0.05
  profile_on_launch: true
  profile_num_repeats: 2
  ft_tokens_admission_constrain_factor: 0.0
  match_prefill_workload_factor: 0
  decode_only_ft_safety_margin: 0.7
debug:
  print_weight_hash: false
  print_activation_hash: false
  print_scheduler_add: false
  print_engine_batch_exec: false
  print_engine_batch_done: false
  print_engine_req_recv: false
adapters:
  lora_path_0: ../adapters/qwen3-32b-qkvo-r16-initial
lora:
  enable_lora: true
  max_loras: 2
  max_lora_rank: 16
server:
  host: 127.0.0.1
  port: 8000
  api_server_count: 1
model:
  model: /mnt/weka/home/jianshu.she/RSI-system/benchmark/ACE/models/Qwen3-32B-yarn131k
  tokenizer_mode: auto
  trust_remote_code: false
  dtype: bfloat16
  max_model_len: 40960
engine:
  gpu_memory_utilization: 0.42   # vLLM budget EXCLUDES the ~58 GB 16K activation buffers + backward child (~15 GB)
  enforce_eager: false
  disable_log_stats: true
  seed: 0
  max_num_batched_tokens: 16384
  long_prefill_token_threshold: 2048
parallel:
  tensor_parallel_size: 4
